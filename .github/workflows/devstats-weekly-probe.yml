name: Temporary DevStats weekly probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read cached weekly Commits metric and current score
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/metrics.py <<'PY'
          import concurrent.futures, datetime as dt, json, urllib.error, urllib.request
          API='https://devstats.cncf.io/api/v1'; USER='thc1006'
          ranges=[(dt.date(2025,7,1),dt.date(2025,7,7))]
          d=dt.date(2025,7,7); end=dt.date(2026,8,9)
          while d<end:
              e=min(d+dt.timedelta(days=7),end); ranges.append((d,e)); d=e
          def one(p):
              a,b=p
              body=json.dumps({'api':'DevActCnt','payload':{'project':'all','range':f'range:{a},{b}','metric':'Commits','repository_group':'All','country':'All','github_id':USER}}).encode()
              req=urllib.request.Request(API,data=body,headers={'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      o=json.loads(r.read()); n=o.get('number') or []
                      return str(a),str(b),int(n[0]) if n else 0
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  if e.code==400 and 'not found in results' in raw: return str(a),str(b),0
                  raise
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              rows=sorted(ex.map(one,ranges))
          print('=== COMMITS_WEEKLY_CSV_BEGIN ===')
          print('from,to,commits')
          for a,b,n in rows: print(f'{a},{b},{n}')
          print('=== COMMITS_WEEKLY_CSV_END ===')

          body=json.dumps({'api':'GithubIDContributions','payload':{'github_id':USER}}).encode()
          req=urllib.request.Request(API,data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as r:
              print('=== CURRENT_SCORE ===')
              print(r.read().decode())
          PY
          python3 /tmp/metrics.py
