name: Temporary DevStats weekly probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Cross-check known weeks through official DevActCnt API
        shell: bash
        run: |
          set -euo pipefail
          api='https://devstats.cncf.io/api/v1'

          query_week() {
            local from="$1" to="$2"
            local payload out code start end
            payload=$(jq -nc --arg r "range:${from},${to}" '{api:"DevActCnt",payload:{project:"all",range:$r,metric:"Contributions",repository_group:"All",country:"All",github_id:"thc1006"}}')
            out="/tmp/${from}_${to}.json"
            start=$(date +%s)
            code=$(curl -sS --retry 1 --retry-delay 2 -m 180 -o "$out" -w '%{http_code}' \
              -X POST "$api" -H 'Content-Type: application/json' -d "$payload" || true)
            end=$(date +%s)
            echo "=== DEVACTCNT ${from} ${to} HTTP=${code} elapsed=$((end-start))s ==="
            cat "$out" | jq . || cat "$out"
          }

          # A week around the first clearly documented thc1006 upstream merges,
          # a high-activity June/July 2026 week, and a current week for calibration.
          query_week 2025-09-29 2025-10-06
          query_week 2026-06-29 2026-07-06
          query_week 2026-08-03 2026-08-09
