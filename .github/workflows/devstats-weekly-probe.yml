name: Temporary DevStats weekly probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query official All CNCF weekly user contributions
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          base='https://all.devstats.cncf.io'
          dash="$base/d/48/users-statistics-by-repository-group?orgId=1&from=1751241600000&to=1786406399000&var-period=w&var-metric=contributions&var-repogroup_name=All&var-users=thc1006"

          curl -fsS -L -A "$ua" -c /tmp/cookies.txt -o /tmp/dash.html -m 30 "$dash"
          curl -fsS -A "$ua" -b /tmp/cookies.txt -o /tmp/dashboard.json -m 30 "$base/api/dashboards/uid/48"

          echo '=== Datasource references in dashboard ==='
          jq -r '.. | objects | .datasource? // empty' /tmp/dashboard.json | sort -u | head -30
          echo '=== Panel target for suser_activity ==='
          jq -c '.. | objects | select((.rawSql? // "") | contains("suser_activity")) | {datasource,refId,format,rawSql}' /tmp/dashboard.json | head -10

          echo '=== Specific datasource endpoints ==='
          for endpoint in '/api/datasources/id/psql' '/api/datasources/name/psql' '/api/datasources/uid/psql'; do
            out="/tmp/ds$(echo "$endpoint" | tr '/' '_').json"
            code=$(curl -sS -A "$ua" -b /tmp/cookies.txt -o "$out" -w '%{http_code}' -m 30 "$base$endpoint" || true)
            echo "$endpoint HTTP $code"
            cat "$out"; echo
          done

          uid=''
          for f in /tmp/ds_api_datasources_name_psql.json /tmp/ds_api_datasources_uid_psql.json; do
            if [ -f "$f" ]; then
              x=$(jq -r '.uid // empty' "$f" 2>/dev/null || true)
              [ -z "$x" ] || { uid="$x"; break; }
            fi
          done
          # Provisioned DevStats datasource commonly uses psql as both name and uid;
          # try that if metadata is intentionally hidden from anonymous viewers.
          [ -n "$uid" ] || uid='psql'
          echo "Trying datasource UID: $uid"

          from_ms=$(date -u -d '2025-06-23 00:00:00' +%s%3N)
          to_ms=$(date -u -d '2026-08-10 23:59:59' +%s%3N)
          sql='select time, "thc1006" as contributions from suser_activity where time >= '\''2025-06-23'\'' and time < '\''2026-08-11'\'' and period = '\''w'\'' and series = '\''userallcontributions'\'' order by time'
          jq -n --arg uid "$uid" --arg sql "$sql" --arg from "$from_ms" --arg to "$to_ms" \
            '{from:$from,to:$to,queries:[{refId:"A",datasource:{uid:$uid,type:"postgres"},rawSql:$sql,format:"table"}]}' > /tmp/query.json

          for qendpoint in '/api/ds/query' '/api/tsdb/query'; do
            echo "=== Query $qendpoint ==="
            qcode=$(curl -sS -A "$ua" -b /tmp/cookies.txt -o /tmp/query-response.json -w '%{http_code}' \
              -X POST "$base$qendpoint" -H 'Content-Type: application/json' --data-binary @/tmp/query.json -m 60 || true)
            echo "HTTP $qcode"
            cat /tmp/query-response.json | jq . || cat /tmp/query-response.json
            if [ "$qcode" = 200 ] && jq -e '.results.A.frames | length > 0' /tmp/query-response.json >/dev/null 2>&1; then
              echo '=== DEVSTATS_WEEKLY_RESULT_BEGIN ==='
              jq -c '.results.A.frames[]?.data.values' /tmp/query-response.json
              echo '=== DEVSTATS_WEEKLY_RESULT_END ==='
              exit 0
            fi
          done
          exit 1
