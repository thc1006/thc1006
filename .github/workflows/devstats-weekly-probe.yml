name: Temporary DevStats weekly probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query official All CNCF weekly user contributions
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Grafana datasource discovery ==='
          curl -fsS --retry 3 --retry-delay 2 -m 30 \
            https://all.devstats.cncf.io/api/datasources -o /tmp/datasources.json
          jq -c '.[] | {id,uid,name,type,isDefault,database}' /tmp/datasources.json

          uid=$(jq -r '[.[] | select(.type=="postgres" and .isDefault==true)][0].uid // [.[] | select(.type=="postgres")][0].uid // empty' /tmp/datasources.json)
          if [ -z "$uid" ]; then
            echo '::error::No PostgreSQL datasource UID found'
            exit 1
          fi
          echo "Using datasource UID: $uid"

          from_ms=$(date -u -d '2025-06-23 00:00:00' +%s%3N)
          to_ms=$(date -u -d '2026-08-10 23:59:59' +%s%3N)

          # Dashboard 48 uses this same table/series. Quote thc1006 because
          # suser_activity is a wide table with one column per selected user.
          sql='select time, "thc1006" as contributions from suser_activity where time >= '\''2025-06-23'\'' and time < '\''2026-08-11'\'' and period = '\''w'\'' and series = '\''userallcontributions'\'' order by time'

          jq -n \
            --arg uid "$uid" \
            --arg sql "$sql" \
            --arg from "$from_ms" \
            --arg to "$to_ms" \
            '{from:$from,to:$to,queries:[{refId:"A",datasource:{uid:$uid,type:"postgres"},rawSql:$sql,format:"table"}]}' \
            > /tmp/query.json

          echo '=== Grafana /api/ds/query ==='
          code=$(curl -sS --retry 2 --retry-delay 2 -m 60 \
            -o /tmp/query-response.json -w '%{http_code}' \
            -X POST https://all.devstats.cncf.io/api/ds/query \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json || true)
          echo "HTTP $code"
          cat /tmp/query-response.json | jq . || cat /tmp/query-response.json

          if [ "$code" != "200" ]; then
            echo '::error::Grafana query endpoint did not return HTTP 200'
            exit 1
          fi

          echo '=== DEVSTATS_WEEKLY_RESULT_BEGIN ==='
          jq -c '.results.A.frames[]?.data.values' /tmp/query-response.json
          echo '=== DEVSTATS_WEEKLY_RESULT_END ==='
